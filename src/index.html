<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust 聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .chat-title {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .room-info {
            display: flex;
            align-items: center;
            margin-left: 10px;
            font-size: 1rem;
            color: #ecf0f1;
        }

        .room-name {
            background-color: #34495e;
            padding: 4px 10px;
            border-radius: 15px;
            margin-left: 8px;
            font-weight: 500;
        }

        .change-room-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            margin-left: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.3s;
        }

        .change-room-btn:hover {
            background-color: #2980b9;
        }

        .connection-status {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e74c3c;
            margin-right: 8px;
        }

        .status-indicator.connected {
            background-color: #2ecc71;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-info {
            display: flex;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        .message-room {
            font-weight: bold;
            margin-right: 10px;
            color: #3498db;
        }

        .message-time {
            margin-left: auto;
        }

        .message-content {
            background-color: white;
            padding: 12px 15px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid #eee;
            background-color: white;
        }

        .chat-input-form {
            display: flex;
        }

        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #3498db;
        }

        .send-button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background-color: #2980b9;
        }

        .send-button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #95a5a6;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-header {
                padding: 10px 15px;
            }

            .chat-title {
                font-size: 1.2rem;
            }

            .room-info {
                font-size: 0.9rem;
            }

            .connection-status {
                font-size: 0.8rem;
            }
        }

        /* 房间选择模态框样式 */
        .room-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .room-modal.active {
            display: flex;
        }

        .room-modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .room-modal-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .room-input-group {
            margin-bottom: 20px;
        }

        .room-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .room-input:focus {
            border-color: #3498db;
        }

        .room-suggestions {
            margin-top: 15px;
        }

        .room-suggestion-item {
            padding: 10px 15px;
            margin-bottom: 5px;
            background-color: #f8f9fa;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .room-suggestion-item:hover {
            background-color: #e9ecef;
        }

        .room-modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .room-modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .room-modal-btn.primary {
            background-color: #3498db;
            color: white;
        }

        .room-modal-btn.primary:hover {
            background-color: #2980b9;
        }

        .room-modal-btn.secondary {
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        .room-modal-btn.secondary:hover {
            background-color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">
                Rust 聊天室
                <div class="room-info">
                    房间: <span class="room-name" id="current-room">rust</span>
                    <button class="change-room-btn" id="change-room-btn">切换房间</button>
                </div>
            </div>
            <div class="connection-status">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="connection-status-text">未连接</span>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-text">暂无消息，开始聊天吧！</div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form class="chat-input-form" id="chat-form">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="message-input" 
                    placeholder="输入消息..." 
                    autocomplete="off"
                    disabled
                />
                <button type="submit" class="send-button" id="send-button" disabled>发送</button>
            </form>
        </div>
    </div>

    <!-- 房间选择模态框 -->
    <div class="room-modal" id="room-modal">
        <div class="room-modal-content">
            <h2 class="room-modal-title">选择或创建房间</h2>
            <div class="room-input-group">
                <input 
                    type="text" 
                    class="room-input" 
                    id="room-input" 
                    placeholder="输入房间名称..." 
                    autocomplete="off"
                />
                <div class="room-suggestions">
                    <div class="room-suggestion-item" data-room="rust">rust</div>
                    <div class="room-suggestion-item" data-room="general">general</div>
                    <div class="room-suggestion-item" data-room="random">random</div>
                    <div class="room-suggestion-item" data-room="tech">tech</div>
                </div>
            </div>
            <div class="room-modal-buttons">
                <button class="room-modal-btn secondary" id="cancel-room-btn">取消</button>
                <button class="room-modal-btn primary" id="join-room-btn">加入房间</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let socket = null;
        let currentRoom = 'rust';
        
        // DOM 元素
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const chatForm = document.getElementById('chat-form');
        const sendButton = document.getElementById('send-button');
        const statusIndicator = document.getElementById('status-indicator');
        const connectionStatusText = document.getElementById('connection-status-text');
        const currentRoomElement = document.getElementById('current-room');
        const changeRoomBtn = document.getElementById('change-room-btn');
        
        // 房间模态框元素
        const roomModal = document.getElementById('room-modal');
        const roomInput = document.getElementById('room-input');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const cancelRoomBtn = document.getElementById('cancel-room-btn');
        const roomSuggestionItems = document.querySelectorAll('.room-suggestion-item');
        
        // 检查是否有消息
        function hasMessages() {
            return chatMessages.querySelectorAll('.message').length > 0;
        }
        
        // 添加消息到聊天窗口
        function addMessage(room, message) {
            // 如果是第一条消息，移除空状态提示
            if (!hasMessages()) {
                chatMessages.innerHTML = '';
            }
            
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageElement.innerHTML = `
                <div class="message-info">
                    <span class="message-room">${room}</span>
                    <span class="message-time">${timeString}</span>
                </div>
                <div class="message-content">${message}</div>
            `;
            
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 连接到指定房间
        function connectToRoom(roomName) {
            // 如果已有连接，先关闭
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            
            // 更新当前房间
            currentRoom = roomName;
            currentRoomElement.textContent = roomName;
            
            // 清空聊天记录
            chatMessages.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">暂无消息，开始聊天吧！</div>
                </div>
            `;
            
            // 更新连接状态
            statusIndicator.classList.remove('connected');
            connectionStatusText.textContent = '连接中...';
            messageInput.disabled = true;
            sendButton.disabled = true;
            
            // 创建新的WebSocket连接
            socket = new WebSocket(`ws://127.0.0.1:3000/ws?room=${roomName}`);
            
            // 监听消息
            socket.onmessage = function(event) {
                const data = event.data;
                // 解析消息格式 [room]: message
                const match = data.match(/^\[([^\]]+)\]: (.*)$/);
                if (match) {
                    const room = match[1];
                    const message = match[2];
                    addMessage(room, message);
                } else {
                    // 如果不是标准格式，直接显示
                    addMessage('系统', data);
                }
            };
            
            // 连接成功
            socket.onopen = function() {
                console.log('连接已建立');
                statusIndicator.classList.add('connected');
                connectionStatusText.textContent = '已连接';
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
                
                // 发送加入房间消息
                socket.send(`大家好，我加入了 ${roomName} 房间！`);
            };
            
            // 连接关闭
            socket.onclose = function() {
                console.log('连接已关闭');
                statusIndicator.classList.remove('connected');
                connectionStatusText.textContent = '连接断开';
                messageInput.disabled = true;
                sendButton.disabled = true;
                
                addMessage('系统', '连接已断开，请刷新页面重新连接');
            };
            
            // 连接错误
            socket.onerror = function(error) {
                console.error('WebSocket错误:', error);
                addMessage('系统', '连接错误，请检查服务器是否运行');
            };
        }
        
        // 显示房间选择模态框
        function showRoomModal() {
            roomModal.classList.add('active');
            roomInput.value = currentRoom;
            roomInput.focus();
        }
        
        // 隐藏房间选择模态框
        function hideRoomModal() {
            roomModal.classList.remove('active');
        }
        
        // 加入房间
        function joinRoom() {
            const roomName = roomInput.value.trim();
            if (roomName && roomName !== currentRoom) {
                connectToRoom(roomName);
                hideRoomModal();
            }
        }
        
        // 事件监听器
        changeRoomBtn.addEventListener('click', showRoomModal);
        
        cancelRoomBtn.addEventListener('click', hideRoomModal);
        
        joinRoomBtn.addEventListener('click', joinRoom);
        
        roomInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                joinRoom();
            }
        });
        
        // 房间建议项点击事件
        roomSuggestionItems.forEach(item => {
            item.addEventListener('click', function() {
                roomInput.value = this.getAttribute('data-room');
            });
        });
        
        // 发送消息
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (message && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(message);
                messageInput.value = '';
                messageInput.focus();
            }
        });
        
        // 初始连接到默认房间
        connectToRoom(currentRoom);
    </script>
</body>
</html>
